<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .zone{rx:10;stroke-width:2}
      .box{fill:#fff;stroke:#334155;stroke-width:1.3;rx:6}
      .t{fill:#0f172a}
      .s{fill:#475569;font-size:11px}
      .h{font-weight:700;font-size:15px}
      .lvl{font-size:11px;font-weight:600}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .deny{stroke:#dc2626;stroke-width:1.8;stroke-dasharray:6 4;fill:none}
      .mon{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:3 3;fill:none}
    </style>
  </defs>
  <rect width="900" height="760" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" class="t h" font-size="18">OT/ICS Cybersecurity Lab: Zones &amp; Conduits</text>

  <!-- IT zone -->
  <rect x="40" y="50" width="820" height="150" class="zone" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="56" y="72" class="t h">Z1 IT / SOC</text><text x="56" y="88" class="lvl" fill="#0369a1">Purdue L4–L5 · 10.10.10.0/24 · SL-1</text>
  <rect x="80" y="105" width="210" height="70" class="box"/><text x="185" y="132" text-anchor="middle" class="t">Kali / Engineering WS</text><text x="185" y="152" text-anchor="middle" class="s">10.10.10.50</text>
  <rect x="345" y="105" width="210" height="70" class="box"/><text x="450" y="132" text-anchor="middle" class="t">Wazuh SIEM</text><text x="450" y="152" text-anchor="middle" class="s">10.10.10.100 · rules 1002xx</text>
  <rect x="610" y="105" width="210" height="70" class="box"/><text x="715" y="132" text-anchor="middle" class="t">Wireshark / Analyst</text><text x="715" y="152" text-anchor="middle" class="s">pcap review</text>

  <!-- Firewall -->
  <rect x="330" y="230" width="240" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="254" text-anchor="middle" class="t" font-weight="700">pfSense firewall (fw01)</text>
  <text x="450" y="272" text-anchor="middle" class="s">default deny · logs → Wazuh</text>
  <path d="M450,200 L450,230" class="ln"/>

  <!-- DMZ -->
  <rect x="40" y="315" width="820" height="120" class="zone" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="56" y="337" class="t h">Z2 DMZ / Supervisory</text><text x="56" y="353" class="lvl" fill="#a16207">Purdue L3.5 · 10.20.20.0/24 · SL-2</text>
  <rect x="200" y="360" width="200" height="60" class="box"/><text x="300" y="385" text-anchor="middle" class="t">Jump host (MFA)</text><text x="300" y="404" text-anchor="middle" class="s">10.20.20.10</text>
  <rect x="500" y="360" width="200" height="60" class="box"/><text x="600" y="385" text-anchor="middle" class="t">Historian</text><text x="600" y="404" text-anchor="middle" class="s">10.20.20.20</text>
  <path d="M450,286 L450,315" class="ln"/>

  <!-- OT zone -->
  <rect x="40" y="470" width="820" height="270" class="zone" fill="#dcfce7" stroke="#16a34a"/>
  <text x="56" y="492" class="t h">Z3 OT / Control</text><text x="56" y="508" class="lvl" fill="#15803d">Purdue L1–L2 · 10.30.30.0/24 · SL-2 · no internet</text>
  <path d="M450,435 L450,470" class="ln"/>

  <rect x="100" y="530" width="220" height="70" class="box"/><text x="210" y="557" text-anchor="middle" class="t">HMI / SCADA (ScadaBR)</text><text x="210" y="577" text-anchor="middle" class="s">10.30.30.20 · only Modbus master</text>
  <rect x="100" y="645" width="220" height="70" class="box"/><text x="210" y="672" text-anchor="middle" class="t">PLC (OpenPLC)</text><text x="210" y="692" text-anchor="middle" class="s">10.30.30.10 · Modbus/TCP :502</text>
  <path d="M210,600 L210,645" class="ln" marker-end="url(#arr)"/>
  <text x="220" y="627" class="s">Modbus/TCP FC1/FC3 poll · FC5 valve</text>

  <rect x="420" y="645" width="200" height="70" class="box"/><text x="520" y="672" text-anchor="middle" class="t">Water tank process</text><text x="520" y="692" text-anchor="middle" class="s">level · pump P-101 · valve V-101</text>
  <path d="M320,680 L420,680" class="ln" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <rect x="670" y="560" width="160" height="70" class="box" stroke="#7c3aed"/><text x="750" y="587" text-anchor="middle" class="t">Suricata IDS</text><text x="750" y="607" text-anchor="middle" class="s">tap on PLC port</text>
  <path d="M670,600 C560,600 400,640 320,668" class="mon"/>
  <path d="M750,560 C760,470 760,300 555,140" class="mon" marker-end="url(#arr)"/>
  <text x="768" y="460" class="s" fill="#7c3aed">alerts → Wazuh</text>

  <!-- denied path -->
  <path d="M110,175 C62,300 62,560 100,665" class="deny" marker-end="url(#arr)"/>
  <text x="80" y="458" class="s" style="fill:#dc2626" font-weight="600">IT → PLC :502 BLOCKED (fw rule 6)</text>

  <!-- legend -->
  <g transform="translate(640,500)">
    <line x1="0" y1="0" x2="26" y2="0" class="ln"/><text x="32" y="4" class="s">allowed flow</text>
    <line x1="0" y1="16" x2="26" y2="16" class="deny"/><text x="32" y="20" class="s">blocked flow</text>
    <line x1="0" y1="32" x2="26" y2="32" class="mon"/><text x="32" y="36" class="s">monitoring</text>
  </g>
</svg>
