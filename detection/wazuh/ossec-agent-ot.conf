<!--
  Wazuh agent snippet for OT hosts (OpenPLC VM, ScadaBR VM, IDS sensor).
  Merge into /var/ossec/etc/ossec.conf on each agent.
-->
<ossec_config>

  <!-- Suricata alerts from the conduit sensor -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- OpenPLC runtime logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/openplc/*.log</location>
  </localfile>

  <!-- File integrity monitoring on the control logic and HMI project -->
  <syscheck>
    <frequency>3600</frequency>
    <directories realtime="yes" report_changes="yes" check_all="yes">/opt/OpenPLC_v3/webserver/st_files</directories>
    <directories realtime="yes" check_all="yes">/opt/scadabr</directories>
    <directories check_all="yes">/etc/ufw</directories>
  </syscheck>

  <!-- OT hosts are static: alert on new listening ports / packages -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <ports all="no">yes</ports>
    <packages>yes</packages>
  </wodle>

  <!-- Keep the agent's own bandwidth low on the control network -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>100</events_per_second>
  </client_buffer>

</ossec_config>
